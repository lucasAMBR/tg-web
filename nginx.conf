server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash gerados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Traduções do i18next: 404 de verdade em vez de cair no index.html
    location /locales/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback do SPA (TanStack Router usa history API)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
